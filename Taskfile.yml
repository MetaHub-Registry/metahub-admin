version: '3'

dotenv: ['.env']
tasks:
  git:
    cmds:
      - git add .
      - git commit -am "{{.CLI_ARGS}}"
  bump:*:
    vars:
      LEVEL: '{{index .MATCH 0}}'
    preconditions:
      - sh: '[ "{{.LEVEL}}" = "patch" ] || [ "{{.LEVEL}}" = "minor" ] || [ "{{.LEVEL}}" = "major" ]'
        msg: "CLI_ARGS must be one of: patch, minor, major"
    cmds:
      - bumpversion {{.LEVEL}}
      - git push 
      - git push --tags
  build:
    cmds:
      - docker buildx build . --build-context metalib=../metahub-core --platform linux/amd64,linux/arm64 -t registry.github.com/metahub-registry/metahub-admin:$(git describe --tags --abbrev=0) --push