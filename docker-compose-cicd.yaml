version: '3.9'
services:
  minio:
    image: quay.io/minio/minio
    volumes:
      - minio:/minio
    environment:
      MINIO_ROOT_USER: "minio"
      MINIO_ROOT_PASSWORD: "miniominio"
    command: ["server", "/data", "--console-address=0.0.0.0:9001"]
  neo4j:
    image: neo4j:4.4.9
    environment:
      NEO4J_AUTH: neo4j/test
    volumes:
     - neo4j:/data
  data:
    image: alpine:3.16
    volumes:
      - ce_data:/opt/community-edition
      - pipeline:/opt/go-agent/pipelines/
    working_dir: ${PWD}
    environment:
      - CE_VER=0.0.7
    command: ["./misc/bin/ce-fetch.sh", "/opt/community-edition"]
  admin:
    image: 193198941246.dkr.ecr.eu-west-1.amazonaws.com/qnib-golang/metahub-admin:v0.1.3
    volumes:
      - .:/go/metahub-admin
      - ce_data:/opt/community-edition
      - pipeline:/opt/go-agent/pipelines/
    working_dir: ${PWD}
    command: ["./misc/bin/parse-dump.sh", "/opt/community-edition"]    
volumes:
  ce_data:
  minio:
  neo4j:
  pipeline:
    external: true