stages:
  - coveragetest
  - build

test:
    stage: coveragetest
    image: registry.gitlab.com/qnib-pub-containers/cicd/golang:1.19.1
    #services:
    #  - docker:20.10.17-dind
    #variables:
    #  DOCKER_HOST: tcp://docker:2375/
    #  DOCKER_DRIVER: overlay2
    before_script:
      - ./misc/bin/remove-replace.sh
      - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@github.com/metahub-registry/metahub-api /tmp/github.com/metahub-registry/metahub-api
      - go mod edit -replace github.com/metahub-registry/metahub-api=/tmp/github.com/metahub-registry/metahub-api
      - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@github.com/metahub-registry/metahub-core /tmp/github.com/metahub-registry/metahub-core
      - go mod edit -replace github.com/metahub-registry/metahub-core=/tmp/github.com/metahub-registry/metahub-core
    script: 
      - go mod tidy
      - go test -short -timeout 60s ./... -coverprofile coverage.txt
      - gocover-cobertura < coverage.txt > coverage.xml
      - gocoverstats -v -f coverage.txt --percent
    coverage: /^Global weighted coverage:\s+(\d+(?:\.\d+)?%)/
    artifacts:
      reports:
        coverage_report:
          coverage_format: cobertura
          path: coverage.xml

container:ecr:
  image: docker:20.10.17
  stage: build
  services:
    - docker:20.10.17-dind
  variables:
    DOCKER_BUILDKIT: 1
    DOCKER_REGISTRY: 193198941246.dkr.ecr.eu-west-1.amazonaws.com/qnib-golang
    IMAGE_NAME: $DOCKER_REGISTRY/$CI_PROJECT_NAME:$CI_COMMIT_TAG
    AWS_REGION: eu-west-1
  only:
    - tags
  before_script:
    - apk add --no-cache curl jq python3 py3-pip git go bash
    - pip install awscli
    - aws ecr get-login-password --region ${AWS_REGION}| docker login --username AWS --password-stdin $DOCKER_REGISTRY
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - ./misc/bin/remove-replace.sh
    - mkdir -p external
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@github.com/metahub-registry/metahub-api $(pwd)/external/github.com/metahub-registry/metahub-api
    - go mod edit -replace github.com/metahub-registry/metahub-api=/go/metahub-admin/external/github.com/metahub-registry/metahub-api
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@github.com/metahub-registry/metahub-core $(pwd)/external/github.com/metahub-registry/metahub-core
    - go mod edit -replace github.com/metahub-registry/metahub-core=/go/metahub-admin/external/github.com/metahub-registry/metahub-core
  script:
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
    - docker build --target=busybox -t $IMAGE_NAME-busybox .
    - docker push $IMAGE_NAME-busybox
    - docker build --target=busybox -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-busybox .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-busybox