version: '3.9'
services:
  data:
    image: alpine:3.16
    volumes:
      - ce_data:/opt/community-edition
      - ./misc/bin:/opt/bin/
    #environment:
    #  - CE_VER=0.0.7
    networks:
     - mh-internal
    command: [/opt/bin/ce-fetch.sh, /opt/community-edition]
  dev:
    build: 
      context: .
      target: dev
    volumes:
      - ce_data:/opt/community-edition
      - ../metahub-core:/go/metalib
      - .:/go/metahub-admin
    networks:
      - mh-internal
      - mh-data
    working_dir: /go/metahub-admin
    command: ["sleep", "inf"]
networks:
  mh-internal:
  mh-data:
    external: true

volumes:
  ce_data: