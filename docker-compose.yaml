version: '3.9'
services:
  minio:
    image: quay.io/minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio:/minio
    environment:
      MINIO_ROOT_USER: "minio"
      MINIO_ROOT_PASSWORD: "miniominio"
    command: ["server", "/data", "--console-address=0.0.0.0:9001"]
    
volumes:
  minio:
