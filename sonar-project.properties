sonar.projectKey=metahub-admin
sonar.qualitygate.wait=true
# The cmd/ package is CLI command orchestration (cobra Run functions wiring I/O:
# registry pushes, graph writes). It is exercised end-to-end by the GoCD e2e
# (misc/gocd/bin/test-repackage.sh + the community-edition seed flows), not by Go
# unit tests, so exclude it from coverage — the gate measures the unit-testable
# library code (pkg/). Issues (e.g. cognitive complexity) are still reported.
sonar.coverage.exclusions=**/cmd/**
