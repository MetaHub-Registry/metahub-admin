version: '3.9'

services:
  minio:
    image: quay.io/minio/minio
    ports:
      - 9000
      - 9001
    volumes:
      - minio:/minio
    environment:
      MINIO_ROOT_USER: "minio"
      MINIO_ROOT_PASSWORD: "miniominio"
    command: ["server", "/minio", "--console-address=0.0.0.0:9001"]
  backup:
    image: alpine:3.16.2
    volumes:
      - minio:/minio
      - ./:/backup
    command: ["sleep", "infinity"]
  neo4j:
    image: neo4j:4.4.9
    ports:
      - 7474
      - 7687
    environment:
      NEO4J_AUTH: neo4j/test
    volumes:
     - neo4j:/data

volumes:
  minio:
  neo4j: