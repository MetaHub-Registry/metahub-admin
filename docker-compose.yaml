version: '3.9'
services:
  data:
    image: alpine:3.16
    volumes:
      - ce_data:/opt/community-edition
      - ./misc/demo:/go/metahub/misc/demo
    networks:
     - mh-internal
    command: [/go/metahub/misc/bin/ce-fetch.ash, /opt/community-edition]
  admin:
    image: 193198941246.dkr.ecr.eu-west-1.amazonaws.com/qnib-golang/metahub-admin:v0.1.1
    networks:
     - mh-internal
     - mh-data
    volumes:
      - .:/go/metahub-admin
      - ce_data:/opt/community-edition
      - /var/lib/metahub/
    working_dir: /var/lib/metahub/
    command: ["sleep", "inf"]    
networks:
  mh-internal:
  mh-data:
    external: true

volumes:
  ce_data: